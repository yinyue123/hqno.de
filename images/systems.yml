# Every system hqnode publishes, in one file.
#
# This is the only list. The workflow builds its matrix from it, and the same
# workflow writes catalog.json from it plus the digests it just pushed — which
# is the file a panel fetches to fill its market. Adding a system is an entry
# here and nothing else.
#
# Fields:
#   id         permanent. A container records the image it was built from and
#              the ids it may be reinstalled to, so changing one orphans
#              containers that are already running.
#   tag        the tag under ghcr.io/<owner>/hqnode, and the name people see in
#              the URL. Also permanent, for the same reason.
#   base       what it is built FROM.
#   recipe     which directory under images/ builds it — and so which init
#              it gets: systemd-deb, systemd-rpm, or openrc-alpine.
#   platforms  what to build. amd64-only where a distro's arm64 packages live
#              somewhere that has moved more than once.
#   name       what the panel shows.
#   blurb      one line under it. Say what is true, including when it is grim.
#
# Order is the order the market list shows: newest first within a family.

systems:
  - id: img_alpine324
    tag: alpine-3.24
    base: alpine:3.24
    recipe: openrc-alpine
    platforms: linux/amd64,linux/arm64
    name: Alpine 3.24
    default: true
    blurb: "The default: OpenRC instead of systemd, a few MB of RAM at idle. Not glibc — some prebuilt binaries will not run."

  - id: img_alpine323
    tag: alpine-3.23
    base: alpine:3.23
