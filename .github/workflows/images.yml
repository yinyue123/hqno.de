name: images

# The system images a container is installed from, and the catalog that tells
# a panel about them.
#
# Three jobs, one list. images/systems.yml is the list: `list` turns it into a
# build matrix, `build` pushes one tag per system to the public package
# ghcr.io/<owner>/hqnode, and `catalog` writes images/catalog.json with the
# digests that were just published. A panel fetches that file and fills its
# market from it — nobody has to run anything by hand for a new image to show
# up in the UI.
#
# The package is created private the first time this runs. Make it public once,
# by hand, at Settings → Packages → hqnode → Change visibility; nothing here can
# do it, and until it is done a host's `podman pull` asks for a login.

on:
  push:
    branches: [main]
    paths: ['images/**', '.github/workflows/images.yml']
  schedule:
    # Weekly, so a tag picks up distro security updates. Existing containers are
    # untouched: their lower layer is immutable and everything downstream pins
    # digests, so the new bytes only reach a holder on reinstall.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  # yq ships on the runner, so the list stays YAML — commentable, and the one
  # place a system is described.
  list:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.read.outputs.systems }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: echo "systems=$(yq -o=json -I=0 '.systems' images/systems.yml)" >> $GITHUB_OUTPUT

  build:
    needs: list
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # the only credential needed: GITHUB_TOKEN
    strategy:
      # One distro failing — an archive host down, a base tag pulled — must not
      # take the other seventeen with it. The catalog job then keeps that
      # system's previous digest, because the tag still points at it.
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.list.outputs.systems) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          # The recipe names the directory, because they are no longer all
          # systemd: Alpine boots OpenRC under busybox init from its own.
          #
          # The context is images/ rather than that directory, because all
          # three recipes COPY the same app-setup tree — the software manager,
          # its helper library and the one script per package — and a context
          # cannot reach above itself.
          context: images
          file: images/${{ matrix.system.recipe }}/Dockerfile
          build-args: BASE=${{ matrix.system.base }}
          platforms: ${{ matrix.system.platforms }}
          push: true
          # Attestation manifests turn a 2-entry index into a 4-entry one where
          # two entries have platform unknown/unknown. The agent selects by
          # platform explicitly, but a boring manifest is one less thing that
          # can be selected wrongly.
          provenance: false
          sbom: false
          # The run-numbered tag is what an operator pins to when they want a
          # specific week; the plain one is what the catalog records.
          tags: |
            ghcr.io/${{ github.repository_owner }}/hqnode:${{ matrix.system.tag }}
            ghcr.io/${{ github.repository_owner }}/hqnode:${{ matrix.system.tag }}-${{ github.run_number }}
      - name: record the digest
        run: |
          {
            echo "| system | base | digest |"
            echo "|---|---|---|"
            echo "| \`${{ matrix.system.tag }}\` | \`${{ matrix.system.base }}\` | \`${{ steps.build.outputs.digest }}\` |"
          } >> $GITHUB_STEP_SUMMARY

  # What makes the market fill itself. Digests are read back from the registry
  # rather than passed out of the matrix: a job that failed leaves its tag
  # pointing at last week's good build, and that is exactly what the catalog
  # should keep saying.
  catalog:
    needs: [list, build]
    if: always() && needs.list.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # it commits catalog.json back
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: write images/catalog.json
        env:
          PACKAGE: ghcr.io/${{ github.repository_owner }}/hqnode
        run: |
          set -euo pipefail
          entries='[]'
          # Process substitution, not a pipe: a `while` on the right of a pipe
          # runs in a subshell and the accumulated JSON never comes back.
          while read -r row; do
            id=$(jq -r .id <<<"$row")
            tag=$(jq -r .tag <<<"$row")
            name=$(jq -r .name <<<"$row")
            blurb=$(jq -r .blurb <<<"$row")
            is_default=$(jq -r '.default // false' <<<"$row")
            arch=$(jq -c '[.platforms | split(",")[] | sub("^linux/"; "")]' <<<"$row")
            ref="$PACKAGE:$tag"

            # The registry's own digest for the tag — the index digest, which is
            # what a panel pins and what the agent selects a platform from.
            digest=$(docker buildx imagetools inspect "$ref" --format '{{ .Manifest.Digest }}' 2>/dev/null) || {
              echo "::warning::$ref could not be read — leaving it out of the catalog"
              continue
            }

            # Size is the amd64 rootfs, compressed: the honest "how big is this
            # download" number. A single-platform tag has its layers inline.
            raw=$(docker buildx imagetools inspect "$ref" --raw)
            child=$(jq -r '(.manifests // [])[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' <<<"$raw" | head -1)
            if [ -n "$child" ]; then
              size=$(docker buildx imagetools inspect "$PACKAGE@$child" --raw | jq '[.layers[].size] | add // 0')
            else
              size=$(jq '[.layers[].size] | add // 0' <<<"$raw")
            fi

            entries=$(jq \
              --arg id "$id" --arg name "$name" --arg ref "$ref" --arg digest "$digest" \
              --arg blurb "$blurb" --argjson arch "$arch" --argjson size "$size" \
              --argjson def "$is_default" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '. + [{id: $id, name: $name, ref: $ref, digest: $digest, arch: $arch,
                     size_bytes: $size, built_at: $built, blurb: $blurb,
                     kind: "builtin", status: "ready"}
                    + (if $def then {default: true} else {} end)]' <<<"$entries")
          done < <(yq -o=json -I=0 '.systems[]' images/systems.yml)

          jq -n --argjson images "$entries" --arg pkg "$PACKAGE" \
            '{schema: 1, package: $pkg, images: $images}' > images/catalog.json
          echo "catalogued $(jq length <<<"$entries") systems"
      - name: commit it if it moved
        run: |
          set -eu
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- images/catalog.json; then
            echo "catalog unchanged"
            exit 0
          fi
          git add images/catalog.json
          git commit -m "Publish image catalog (run ${{ github.run_number }})"
          # A push made with GITHUB_TOKEN does not trigger workflows, so this
          # cannot loop back into itself despite matching the images/** filter.
          #
          # Rebase first, and retry: this job checks out the commit that
          # triggered the run, so anything pushed to main while the twenty
          # image builds were running (~8 minutes) makes a bare `git push`
          # fail with "fetch first" — and the whole publish is lost even
          # though every image reached the registry. That happened on run 38
          # and a `gh run rerun` cannot fix it, because a rerun checks out
          # the same triggering commit and loses the same race again. The
          # catalog is a generated file that only ever touches
          # images/catalog.json, so replaying it onto whatever main has
          # become is always the right merge.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto origin/main"
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "could not publish the catalog after 3 attempts" >&2
          exit 1
